# TLS front door for the JO portal.
#
# :443 serves the portal and the API on one origin, which is what the frontend
# already expects when it is not served from port 3000.
#
# The old plaintext ports are kept alive but only to send people to HTTPS:
# host :3000 (the address staff have bookmarked) and host :8080 (the address
# older tabs call the API on) both land on redirect listeners here instead of
# on the app containers.

server {
    listen 443 ssl;
    http2 on;
    server_name jo.imperialnetworkph.com 10.86.0.173;

    ssl_certificate     /etc/nginx/certs/jo.crt;
    ssl_certificate_key /etc/nginx/certs/jo.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # customer documents can be large, and templates are uploaded through here
    client_max_body_size 30m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        # the API sets these itself; hide its copies so responses do not carry
        # each header twice
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://backend:8080/health;
        proxy_set_header Host $host;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        # vite preview refuses Host headers it does not recognise (403), so the
        # upstream always sees a name it accepts while the browser keeps using
        # whatever address or DNS name it came in on
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

# published as host :3000 - where staff bookmarks point
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# published as host :8080 - old tabs still calling the API in the clear.
# 308 keeps the method and body, so a POST is retried against HTTPS rather
# than being silently turned into a GET.
server {
    listen 8081 default_server;
    server_name _;
    return 308 https://$host$request_uri;
}
