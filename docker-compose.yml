services:
  db:
    image: postgres:16-alpine
    container_name: pdf_workflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pdf_workflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: pdf_workflow_backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/pdf_workflow
      STORAGE_ROOT: /app/storage
    expose:
      - "8080"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./storage:/app/storage
    command: sh -c "npm install && npm run dev"

  frontend:
    build:
      context: ./frontend
    container_name: pdf_workflow_frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"

volumes:
  pgdata:
