# Production overlay — serves the frontend as a built bundle instead of the Vite
# dev server, and adds a backend healthcheck.
#
#   sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Dev (default) stays exactly as before:
#   sudo docker compose up -d
services:
  backend:
    # plain node, not nodemon: a stray file edit must not restart the live API,
    # and a crash is left to the restart policy + healthcheck to surface
    command: sh -c "npm install && npm start"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    command: sh -c "npm install && npm run build && npm run preview"
